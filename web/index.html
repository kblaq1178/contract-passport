<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contract Passport - Stacks testnet registry</title>
    <meta
      name="description"
      content="Contract Passport is a self-attested on-chain metadata registry for Stacks smart contracts."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235546ff'/%3E%3Cpath d='M11 23V9h10M11 16h8' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!--
      Static first render: this shell is visible before (and even without) JavaScript.
      src/main.ts replaces it with the live app on mount, then loads the wallet/API code.
    -->
    <div id="app" class="app-shell">
      <header class="site-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="30" height="30" role="img">
              <rect width="32" height="32" rx="8" fill="#5546ff"></rect>
              <path d="M11 23V9h10M11 16h8" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"></path>
            </svg>
          </span>
          <div class="brand-text">
            <h1 class="brand-title">CONTRACT PASSPORT</h1>
            <p class="brand-sub">Know what a Stacks contract is before you interact with it.</p>
          </div>
        </div>
        <div class="header-actions">
          <span class="net-badge">STACKS TESTNET</span>
          <button id="wallet-button" class="btn btn-ghost" type="button">Connect Stacks wallet</button>
        </div>
      </header>
      <section class="panel search-panel">
        <p class="hint">Loading the registry UI...</p>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
